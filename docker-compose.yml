services:
  api:
    image: ghcr.io/school-of-company/dovi-ai-server:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    env_file: .env
    # graceful_shutdown_seconds(기본 130s)보다 넉넉해야 앱이 처리 중이던 리뷰를
    # 마무리할 시간을 벌기 전에 SIGKILL 당하지 않는다.
    stop_grace_period: 150s
    depends_on:
      - qdrant
    volumes:
      # CodeRankEmbed 등 HuggingFace 모델 가중치 캐시. 마운트 없이는 컨테이너를
      # 재생성할 때마다(배포마다) 매번 다시 다운로드해야 해서, 다운로드 경로가
      # 불안정하면(HF CDN 타임아웃 등) 배포 자체가 막힌다.
      - hf_cache:/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:v1.15.1
    # 부트스트랩 인덱싱 CLI(scripts/index_repo.py)를 이 호스트에서 직접 돌릴 때만
    # 필요해서 localhost로만 연다 — 외부에 인증 없는 벡터DB를 노출하지 않는다.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  hf_cache:
