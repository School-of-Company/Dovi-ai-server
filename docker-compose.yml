services:
  api:
    image: ghcr.io/school-of-company/dovi-ai-server:${IMAGE_TAG:-latest}
    # 재시작 정책이 없어서 OOM-kill 등으로 죽으면 사람이 수동으로 살릴 때까지
    # 계속 죽어있던 사고(2026-09-20, 24시간 방치)가 있었다 — 명시적으로 걸어둔다.
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    # graceful_shutdown_seconds(기본 260s)보다 넉넉해야 앱이 처리 중이던 리뷰를
    # 마무리할 시간을 벌기 전에 SIGKILL 당하지 않는다.
    stop_grace_period: 280s
    depends_on:
      # qdrant는 healthcheck가 없어 "컨테이너 시작"까지만 기다린다
      # (기존 리스트 형식 `- qdrant`와 동일한 의미).
      qdrant:
        condition: service_started
    volumes:
      # CodeRankEmbed 등 HuggingFace 모델 가중치 캐시. 마운트 없이는 컨테이너를
      # 재생성할 때마다(배포마다) 매번 다시 다운로드해야 해서, 다운로드 경로가
      # 불안정하면(HF CDN 타임아웃 등) 배포 자체가 막힌다.
      - hf_cache:/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:v1.15.1
    # api와 같은 이유(재시작 정책 누락 사고) — 재부팅 시 SIGTERM으로 내려간 뒤
    # 자동으로 안 돌아와 RAG가 조용히 비활성화됐던 적이 있어 명시적으로 건다.
    restart: unless-stopped
    # 부트스트랩 인덱싱 CLI(scripts/index_repo.py)를 이 호스트에서 직접 돌릴 때만
    # 필요해서 localhost로만 연다 — 외부에 인증 없는 벡터DB를 노출하지 않는다.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    # 리뷰 컨슈머는 순차 처리라 슬롯 여러 개를 둘 근거가 없고, np를 비우면
    # (auto) llama-server가 슬롯을 여러 개 잡으면서 --kv-unified도 자동으로
    # 켜져 여러 요청이 KV 캐시 풀을 나눠 쓰게 된다 — /props가 보고하는
    # n_ctx가 실제로 한 요청이 쓸 수 있는 양보다 낙관적일 수 있다는
    # 뜻이다(이슈 #106). comment_answer 파이프라인과의 동시 요청은 실패
    # 대신 대기하는 쪽이 안전해 슬롯을 1개로 고정한다.
    # 컨텍스트를 16384로 키운 건 배치당 리뷰 파일 수를 늘리기 위해서다 — KV 캐시는
    # 토큰당 약 256KB(Qwen2.5-32B)라 8192 대비 GPU 2장에 장당 약 1GB가 늘고,
    # 운영 여유(장당 약 5GB) 안이다. 앱의 LLM_MAX_CONTEXT도 같이 맞춘다.
    command:
      [
        "-m", "/models/Qwen2.5-Coder-32B-Instruct-Q4_K_M.gguf",
        "-ngl", "99",
        "-c", "16384",
        "-np", "1",
        "--host", "0.0.0.0",
        "--port", "8000",
      ]
    ports:
      - "8001:8000"
    volumes:
      - /home/ubuntu/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- Langfuse self-hosted (LLM 호출 트레이싱) ---
  # LANGFUSE_ENABLED=true일 때만 app/main.py가 클라이언트를 초기화한다.
  # 아래 langfuse-* 스택은 그 트레이스를 받는 서버 쪽 구성이다.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: always
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      # 단일 노드 ClickHouse — 명시적으로 꺼두지 않으면 마이그레이션이
      # ON CLUSTER(Zookeeper 필요)로 시도되다 실패한다.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: always
    depends_on: *langfuse-depends-on
    # 방화벽이 없는 호스트라 localhost로만 열고, 볼 때는 SSH 터널로 접속한다.
    # (예: ssh -L 80:localhost:80 -p 21114 ubuntu@ssh.gsmsv.site)
    ports:
      - "127.0.0.1:80:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: dovi
      LANGFUSE_INIT_ORG_NAME: Dovi
      LANGFUSE_INIT_PROJECT_ID: dovi-review-pipeline
      LANGFUSE_INIT_PROJECT_NAME: dovi-review-pipeline
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-dovi-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-redis:
    image: docker.io/redis:7
    restart: always
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH}
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    image: docker.io/postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  hf_cache:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
