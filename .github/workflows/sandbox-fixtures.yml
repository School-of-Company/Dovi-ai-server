name: Sandbox fixtures

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/sandbox_probe/**"
      - "tests/test_sandbox_probe_fixtures.py"
      - ".github/workflows/sandbox-fixtures.yml"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest -m fixture_replay -v
        env:
          FIXTURE_GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_FIXTURES: "1"
